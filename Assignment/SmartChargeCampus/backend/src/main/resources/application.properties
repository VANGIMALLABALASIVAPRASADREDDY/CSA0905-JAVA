# ============================================================
# SmartCharge Campus: Backend Spring Boot Configuration
# ============================================================

server.port=8080

# Database Configuration (Local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smartcharge_campus?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Luckychamp@007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Campus Load Limit (kW)
smartcharge.campus.max-load-kw=100.0

# Logging Configuration
logging.level.com.smartcharge=INFO
logging.level.org.springframework.web=INFO
